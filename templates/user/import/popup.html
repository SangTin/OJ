<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}"{% if SITE_THEME_NAME != 'auto' %} data-theme="{{ SITE_THEME_NAME }}"{% endif %}>
<head>
    <meta charset="utf-8">
    <title>{{ title }}</title>
    {% if PREFERRED_STYLE_CSS %}
        <link rel="stylesheet" href="{{ static(PREFERRED_STYLE_CSS) }}">
    {% else %}
        <link rel="stylesheet" href="{{ static(LIGHT_STYLE_CSS) }}">
        <link rel="stylesheet" href="{{ static(DARK_STYLE_CSS) }}" media="(prefers-color-scheme: dark)">
    {% endif %}
    <style>
        html, body { min-height: 0; }
        body { margin: 0; padding: 16px 20px; }
        h2.user-import-title { margin: 0 0 12px; }
    </style>
</head>
<body data-theme="{{ SITE_THEME_NAME }}">
<h2 class="user-import-title">{{ title }}</h2>
{% include "user/import/content.html" %}
{% if step == 'result' %}
    <div class="user-import-buttons" style="margin-top: 12px">
        <button type="button" onclick="window.parent.closeContestantImport && window.parent.closeContestantImport()">{{ _('Done') }}</button>
    </div>
    <script>
        // Hand the contestants to the contest form that opened this popup; it skips the ones already listed.
        if (window.parent && window.parent.addImportedContestants) {
            window.parent.addImportedContestants({{ contestants|tojson }});
        }
    </script>
{% endif %}
</body>
</html>
